name: Format tenancy feature (temporary)
on:
  push:
    branches: ['feature/unified-tenancy']
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-tenancy
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - run: rustup default 1.95.0
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates services
            git commit -m "style(tenancy): apply workspace rustfmt"
            git push origin HEAD:feature/unified-tenancy
          fi
