name: Temporary Cargo lockfile security refresh
on:
  push:
    branches: ['feature/unified-tenancy']
    paths: ['.github/workflows/dependency-lock-refresh.yml']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Refresh resolved dependencies
        shell: bash
        run: |
          cargo update -p lettre --precise 0.11.24
          cargo update -p arrow-data --precise 60.1.0
          cargo update -p sqlx-sqlite
          cargo update -p chrono
      - name: Print deterministic refreshed lockfile
        shell: bash
        run: |
          printf '%s\n' 'PERO_LOCK_BEGIN'
          cat Cargo.lock
          printf '%s\n' 'PERO_LOCK_END'
