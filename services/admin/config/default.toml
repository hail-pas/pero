# Shared defaults. Supply environment-specific OAuth credentials and URLs in local.toml or production.toml.

[server]
host = "0.0.0.0"
port = 3000
request_body_limit_bytes = 10485760
graceful_shutdown_timeout_secs = 30
cleanup_interval_secs = 3600
trusted_proxies = []
client_ip_header = "x_forwarded_for"

[server.cors]
allow_origins = []
allow_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allow_headers = ["authorization", "content-type", "accept-language", "x-request-id"]
allow_credentials = false
expose_headers = ["x-request-id", "x-process-time"]
max_age_secs = 3600

[log]
level = "info"
format = "pretty"
dir = "logs"
rotation = "daily"

[oauth2]
issuer = ""
client_id = ""
client_secret = ""
redirect_uri = ""
post_logout_redirect_uri = ""
scopes = ["openid", "profile", "email"]
jwks_cache_ttl_seconds = 3600

[cookie]
domain = ""
secure = true
same_site = "Lax"
path = "/"

[frontend]
static_dir = "ui/static"
