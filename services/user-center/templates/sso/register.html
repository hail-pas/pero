{% extends "layouts/auth.html" %}
{% block title %}Pero · Register{% endblock %}
{% block content %}
<div class="auth-card split-card">
  <section class="auth-hero-panel">
    <a class="brand compact" href="/sso/login"><img class="logo-mark" src="/static/icons/logo.png" alt="P" /><span>Pero</span></a>
    <h2 data-i18n="register.title">创建账户</h2>
    <p class="accent-copy" data-i18n="register.accentCopy">Create your account</p>
    <p data-i18n="register.desc">快速开始，探索更强大的身份能力</p>
    <div class="glass-illustration cube small" aria-hidden="true"></div>
  </section>

  <section class="form-panel">
    {% include "partials/error_notice.html" %}
    <form class="stack" method="post" action="/sso/register" data-password-confirm data-strip-empty novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label class="field"><span><span data-i18n="field.username">用户名</span><span data-i18n="tip.charRange">（3-64 个字符）</span></span><input name="username" minlength="3" maxlength="64" required autocomplete="username" placeholder="Username" data-i18n-placeholder="field.usernamePlaceholder" /></label>
      <label class="field"><span><span data-i18n="field.email">邮箱</span><span data-i18n="tip.optional">（可选）</span></span><input name="email" type="email" autocomplete="email" placeholder="name@example.com" data-i18n-placeholder="field.emailPlaceholder" /></label>
      <label class="field has-action"><span><span data-i18n="field.password">密码</span><span data-i18n="tip.passwordRange">（8-128 个字符）</span></span><input name="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" data-password-strength placeholder="Password" data-i18n-placeholder="field.passwordPlaceholder" />        <button class="input-action" type="button" data-toggle-password>👁</button></label>
      <div class="password-meter" data-password-meter><span></span><span></span><span></span><span></span></div>
      <label class="field"><span><span data-i18n="field.nickname">昵称</span><span data-i18n="tip.optional">（可选）</span></span><input name="nickname" placeholder="Nickname" data-i18n-placeholder="field.nicknamePlaceholder" /></label>
      <label class="field"><span><span data-i18n="field.phone">手机号</span><span data-i18n="tip.optional">（可选）</span></span><input name="phone" inputmode="tel" autocomplete="tel" placeholder="+86 138 0000 8888" data-i18n-placeholder="field.phonePlaceholder" /></label>
      <label class="checkbox"><input type="checkbox" required /> <span data-i18n="register.terms">我已阅读并同意服务条款和隐私政策</span></label>
      <button class="btn primary full" type="submit" data-i18n="register.submit">创建账户</button>
      <p class="switch-link"><span data-i18n="register.haveAccount">已有账户？</span> <a href="/sso/login" data-i18n="register.goLogin">去登录</a></p>
    </form>
  </section>
</div>
{% endblock %}
