<!doctype html>
<html lang="zh-CN">
<head>
  <script>try{document.documentElement.lang=(localStorage.getItem('pero.lang')||'zh')==='en'?'en':'zh-CN'}catch(e){}</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ "dash.title" }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="account-body">
  <div class="app-shell">
    <header class="app-header">
      <button class="icon-button mobile-only" type="button" data-nav-toggle aria-label="Open navigation">☰</button>
      <a class="brand compact" href="/dashboard"><img class="logo-mark" src="/static/icons/logo.png" alt="P" /><span>Pero</span></a>
      <div class="header-actions">
        <div class="top-tools">
          <button class="lang-pill is-active" type="button" data-lang="zh">中</button>
          <button class="lang-pill" type="button" data-lang="en">EN</button>
        </div>
        <div class="header-user" data-user-menu>
          <button class="header-user-trigger" type="button" aria-label="User menu">
            <span class="avatar sm">{% if !layout.user_avatar_url.is_empty() %}<img src="{{ layout.user_avatar_url }}" alt="">{% else %}{{ layout.user_initial }}{% endif %}</span>
            <span class="desktop-only">{{ layout.user_name }}</span>
          </button>
          <div class="user-dropdown" data-user-dropdown>
            <a href="/account/profile" class="dropdown-item"><span>⌂</span> <span data-i18n="dash.nav.profile">个人中心</span></a>
            <a href="/account/change-password" class="dropdown-item"><span>🔒</span> <span data-i18n="dash.nav.changePassword">修改密码</span></a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" type="button" data-post-action="/account/logout" data-redirect="/oauth2/session/end" data-i18n="dash.nav.logout">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar" data-sidebar>
      <nav>
        <a href="/dashboard/apps" class="nav-item {% if layout.active == "apps" %}is-active{% endif %}"><span>📦</span><span data-i18n="dash.apps">应用管理</span></a>
        <a href="/dashboard/users" class="nav-item {% if layout.active == "users" %}is-active{% endif %}"><span>👤</span><span data-i18n="dash.users">用户管理</span></a>
        <a href="/dashboard/providers" class="nav-item {% if layout.active == "providers" %}is-active{% endif %}"><span>🔑</span><span data-i18n="dash.providers">身份提供者</span></a>
      </nav>
      <nav style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border);">
        <a href="/account/profile" class="nav-item"><span>←</span><span data-i18n="dash.backToAccount">返回个人中心</span></a>
      </nav>
    </aside>

    <section class="content-pane">
      {% block content %}{% endblock %}
    </section>
  </div>
  <div class="sidebar-backdrop" data-nav-backdrop></div>
  <div class="toast" data-toast role="status" aria-live="polite"></div>
  {% include "partials/scripts_base.html" %}
</body>
</html>
