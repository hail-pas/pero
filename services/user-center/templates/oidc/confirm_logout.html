{% extends "layouts/auth.html" %}
{% block title %}Pero · Confirm Sign Out{% endblock %}
{% block content %}
<div class="auth-card centered-card">
  <h2 data-i18n="end_session.confirmTitle">确认退出当前账号？</h2>
  <p data-i18n="end_session.confirmDesc">退出请求无法与当前登录会话匹配。您尚未退出，请确认是否退出当前账号。</p>
  <form method="post" action="/oauth2/session/end">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="session_id" value="{{ session_id }}">
    <input type="hidden" name="id_token_hint" value="{{ id_token_hint }}">
    <input type="hidden" name="post_logout_redirect_uri" value="{{ post_logout_redirect_uri }}">
    <input type="hidden" name="state" value="{{ state }}">
    <button class="btn primary" type="submit" name="confirm" value="yes" data-i18n="end_session.confirm">退出当前账号</button>
    <a class="btn" href="/account/profile" data-i18n="end_session.cancel">取消</a>
  </form>
</div>
{% endblock %}
