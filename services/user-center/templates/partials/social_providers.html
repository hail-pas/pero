{% if !providers.is_empty() %}
<div class="divider"><span data-i18n="login.continueWith">或使用以下方式登录</span></div>
  <div class="provider-grid compact-providers">
  {% for provider in providers %}
    <a href="{{ social_prefix }}/{{ provider.key }}/login" class="provider-button" aria-label="{{ provider.name }}">
      <img class="provider-icon" src="/static/icons/{% if !provider.icon.is_empty() %}{{ provider.icon }}{% else %}default{% endif %}.svg" alt="{{ provider.name }}" width="24" height="24" />
    </a>
  {% endfor %}
  </div>
{% endif %}
