{% extends "layouts/dashboard.html" %}

{% block title %}{% if mode == "create" %}创建应用{% else %}编辑应用{% endif %}{% endblock %}

{% block content %}
<div class="page-heading">
  <div>
    <h1>{% if mode == "create" %}创建应用{% else %}编辑应用{% endif %}</h1>
  </div>
</div>

<div class="card-panel form-card" style="max-width: 640px;">
  {% if !error.is_empty() %}
  <div class="notice danger"><strong>!</strong><span>{{ error }}</span></div>
  {% endif %}

  <form method="post" action="{% if mode == "create" %}/dashboard/apps/new{% else %}/dashboard/apps/{{ app_id }}/edit{% endif %}" data-ajax-form data-toast-i18n="toast.saved" data-redirect="/dashboard/apps" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div class="stack">
      <label class="field">
        <span data-i18n="dash.app.codeLabel">应用编码</span>
        <input name="code" value="{{ form.code }}" required {% if mode == "edit" %}readonly{% endif %} placeholder="my-app" data-i18n-placeholder="dash.app.codePlaceholder" />
      </label>
      <label class="field">
        <span data-i18n="dash.app.nameLabel">应用名称 *</span>
        <input name="name" value="{{ form.name }}" required placeholder="我的应用" data-i18n-placeholder="dash.app.namePlaceholder" />
      </label>
      <label class="field">
        <span data-i18n="dash.app.typeLabel">应用类型</span>
        <select name="app_type">
          <option value="web" {% if form.app_type == "web" %}selected{% endif %}>Web</option>
          <option value="spa" {% if form.app_type == "spa" %}selected{% endif %}>SPA</option>
          <option value="mobile" {% if form.app_type == "mobile" %}selected{% endif %}>Mobile</option>
          <option value="service" {% if form.app_type == "service" %}selected{% endif %}>Service</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="dash.app.descLabel">描述</span>
        <input name="description" value="{{ form.description }}" placeholder="应用描述（可选）" data-i18n-placeholder="dash.app.descPlaceholder" />
      </label>
      <label class="field">
        <span data-i18n="dash.app.homepageLabel">首页 URL</span>
        <input name="homepage_url" value="{{ form.homepage_url }}" placeholder="https://..." />
      </label>
      <label class="field">
        <span data-i18n="dash.app.logoLabel">Logo URL</span>
        <input name="logo_url" value="{{ form.logo_url }}" placeholder="https://..." />
      </label>
      <label class="checkbox">
        <input type="checkbox" name="auto_access" {% if form.auto_access.is_some() %}checked{% endif %} />
        <span data-i18n="dash.app.autoAccessHint">自动授权访问（新注册用户自动获得此应用访问权限）</span>
      </label>
      <div class="form-actions">
        <a href="/dashboard/apps" class="btn secondary" data-i18n="dash.cancel">取消</a>
        <button type="submit" class="btn primary" data-i18n="dash.save">保存</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
