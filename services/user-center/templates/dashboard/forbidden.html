{% extends "layouts/auth.html" %}

{% block title %}{{ "dash.forbidden.title" }}{% endblock %}

{% block content %}
<div class="auth-main">
  <div class="auth-card error-card">
    <div class="error-grid">
      <div class="space-illustration" aria-hidden="true">
        <span class="planet"></span><span class="rocket">🚫</span>
      </div>
      <div>
        <h2 data-i18n="dash.forbidden.title">无权访问</h2>
        <p data-i18n="dash.forbidden.desc">您没有管理后台的访问权限，请联系管理员。</p>
        <a class="btn primary" href="/account/profile" data-i18n="dash.forbidden.backToProfile">返回个人中心</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
