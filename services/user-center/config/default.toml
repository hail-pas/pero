[server]
host = "0.0.0.0"
port = 8080
request_body_limit_bytes = 1048576
trusted_proxies = []
# Select the only header sanitized by trusted_proxies; no fallback to other headers.
client_ip_header = "x_forwarded_for"

[database]
url = ""
max_connections = 20
min_connections = 5
encrypt_key = ""

[redis]
url = ""
pool_size = 10

[log]
level = "info"
format = "json"
dir = "./logs"
rotation = "daily"

[oidc]
issuer = ""

[oauth2]
# 0 preserves per-login upstream JWKS checks; opt in to at most 300 seconds.
upstream_jwks_cache_ttl_seconds = 0
auth_code_ttl_seconds = 600

[sso]
base_url = ""
session_ttl_seconds = 600
cookie_secure = true
cookie_same_site = "Lax"
cookie_signing_secret = ""

[password]
min_length = 8
max_length = 128
require_uppercase = true
require_lowercase = true
require_digit = true
require_special = false

[password_reset]
signing_key = ""
ttl_seconds = 3600

[frontend]
static_dir = "ui/static"

[http_config]

[notification]
# Optional HTTP gateway for channels without a direct adapter.
# Configure notification.smtp or notification.sms below to send without a gateway.
endpoint = ""
bearer_token = ""

# Optional direct delivery channels. Missing/invalid settings do not block startup;
# requests requiring an unavailable channel return 503. See docs/application-portal-and-delivery.md.
# [notification.smtp]
# host = "smtp.example.com"
# port = 587
# security = "starttls" # or "tls" with port 465
# username = "notify@example.com"
# password = "REPLACE_WITH_SMTP_PASSWORD"
# from = "Pero <notify@example.com>"
# [notification.sms]
# account_sid = "AC_REPLACE_WITH_32_HEX_DIGITS"
# auth_token = "REPLACE_WITH_TWILIO_TOKEN"
# from = "+12025550123"
