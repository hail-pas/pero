# Shared defaults. Supply environment-specific values in local.toml or production.toml.
# Never commit credentials, private keys or environment-specific configuration.

[server]
host = "0.0.0.0"
port = 8080
request_body_limit_bytes = 1048576
graceful_shutdown_timeout_secs = 30
cleanup_interval_secs = 3600
trusted_proxies = []
# Use only the header sanitized by trusted_proxies; no fallback to other headers.
client_ip_header = "x_forwarded_for"

[server.cors]
allow_origins = []
allow_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allow_headers = ["authorization", "content-type", "accept-language", "x-request-id"]
allow_credentials = false
expose_headers = ["x-request-id", "x-process-time"]
max_age_secs = 3600

[log]
level = "info"
format = "json"
dir = "./logs"
rotation = "daily"

[retention]
# Database event retention in days. Set either value to 0 for indefinite retention.
login_event_days = 90
audit_event_days = 365

[database]
url = ""
encrypt_key = ""
max_connections = 20
min_connections = 5
acquire_timeout_secs = 10
idle_timeout_secs = 600
max_lifetime_secs = 1800

[redis]
url = ""
pool_size = 10
connect_timeout_secs = 5
command_timeout_secs = 3

[oidc]
issuer = ""

[oauth2]
authorization_request_ttl_seconds = 600
auth_code_ttl_seconds = 120
# 0 preserves per-login upstream JWKS checks; opt in to at most 300 seconds.
upstream_jwks_cache_ttl_seconds = 0

[sso]
base_url = ""
session_cookie_name = "pero_sso"
session_ttl_seconds = 3600
session_idle_ttl_seconds = 1800
session_touch_interval_seconds = 10
cookie_secure = true
cookie_same_site = "Lax"
cookie_domain = ""
cookie_path = "/"
cookie_signing_secret = ""

[password]
min_length = 8
max_length = 128
require_uppercase = true
require_lowercase = true
require_digit = true
require_special = false

[password_reset]
signing_key = ""
ttl_seconds = 3600

[frontend]
static_dir = "ui/static"

[http_config]
timeout_secs = 30
connect_timeout_secs = 5
pool_idle_timeout_secs = 90
pool_max_idle_per_host = 16
max_response_bytes = 2097152
# user_agent = "Pero"

[http_config.retry]
enabled = false
max_retries = 3
base_delay_millis = 100
max_delay_millis = 2000

[notification]
# Optional HTTP gateway for channels without a direct adapter.
endpoint = ""
bearer_token = ""

# Optional direct delivery channels. Missing/invalid settings do not block startup;
# requests requiring an unavailable channel return 503. See docs/application-portal-and-delivery.md.
# [notification.smtp]
# host = "smtp.example.com"
# port = 587
# security = "starttls" # or "tls" with port 465
# username = "notify@example.com"
# password = "REPLACE_WITH_SMTP_PASSWORD"
